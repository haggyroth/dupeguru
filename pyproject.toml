[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.black]
line-length = 120
# Generated by build.py --resources; formatting it would only churn base64 blobs. It used to
# be skipped implicitly because the generated resource module was gitignored; it is committed
# now, so the exclusion has to be explicit. force-exclude so pre-commit honours it too.
force-exclude = "qt/resources_data\\.py"
[tool.isort]
# make it compatible with black
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
# Without this a bare `pytest` walks the whole tree and aborts during collection, because
# mutmut generates a full copy of core/, qt/ and hscommon/ under mutants/ (see also_copy
# below). Two copies of core.tests.conftest is an ImportPathMismatchError, which reads like a
# broken checkout rather than "you gave me no arguments". mutants/ is gitignored, so this only
# ever bites someone who has run the mutation script -- locally, which is the only place it runs.
#
# These are the same four directories the Makefile, tox.ini and the CI workflow all pass by
# hand. Naming them once means a bare `pytest` does what every other entry point does, and
# those explicit lists become a convenience rather than the thing holding the suite together.
testpaths = ["core", "hscommon", "qt", "tests"]
# testpaths is enough on its own for a bare `pytest`, but norecursedirs also covers `pytest .`
# and an explicit path that contains the copy.
#
# Setting this *replaces* pytest's defaults rather than adding to them, so they are repeated
# verbatim and the three we care about are appended. Note `.*`, which is doing more work than
# it looks like: it excludes every dot-directory, so enumerating .tox and .git by hand would
# quietly stop excluding .venv, .pytest_cache and the rest.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    # Ours: mutmut's generated copy, the Makefile's virtualenv, and the packaging output.
    "mutants",
    "env*",
    "pkg",
]
# ResourceWarning is escalated where it can be. Note the limit, because it is easy to assume
# more protection than this gives: sqlite3 and file objects emit ResourceWarning from their
# finalisers, and an exception raised there is swallowed by the interpreter, so a leaked
# connection is still only *reported* and cannot fail a run. Verified by deliberately leaking
# one -- the test passed with a warning.
#
# The real guarantee is the autouse fixtures in core/tests/conftest.py and qt/tests/conftest.py,
# which close what the tests open. This entry keeps the warnings visible and catches the cases
# that are raised outside a finaliser.
filterwarnings = [
    "error::ResourceWarning",
]

[tool.mutmut]
# Mutation testing runs the test suite once per mutant, so scope is everything: mutating the
# whole tree would run for hours and spend most of it on plumbing. These are the modules where
# a surviving mutant means a user loses files or is shown something untrue -- the two caches
# whose invalidation decides whether stale data reaches the results.
#
# Run it with `make mutants`. It is not part of CI: it is a periodic audit of test quality, not
# a gate, and making it a required check would put an hour-long job in front of every merge.
source_paths = ["core/app.py", "core/file_list_cache.py", "core/pe/match_cache.py"]
# Only the tests that could plausibly kill these mutants. Running everything per mutant
# multiplies an already long job by tests that cannot be affected.
pytest_add_cli_args_test_selection = [
    "core/tests/app_test.py",
    "core/tests/file_list_cache_test.py",
    "core/tests/match_cache_test.py",
]
# mutmut runs against an isolated copy in mutants/, and copies only the files it mutates. The
# packages those import -- including the built C extensions in core/pe -- have to come along or
# nothing imports. Listing whole packages rather than individual modules because the import
# graph here is wide and a missing one fails as a bare ImportError inside a mutant run, which
# reads as a killed mutant rather than as broken configuration.
also_copy = [
    "core/",
    "hscommon/",
    "qt/",
    "tests/",
    "cli.py",
    "run.py",
    "conftest.py",
]
