[tox]
envlist = py310,py311,py312,py313,py314
skipsdist = True
skip_missing_interpreters = True

[testenv]
setenv =
    PYTHON="{envpython}"
commands =
    python build.py --modules
    flake8
    black --check .
    {posargs:py.test core hscommon qt tests}
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-extra.txt

[flake8]
# mutants: scripts/mutate.py's generated tree. pre-commit passes an explicit file list so it
# never sees it, but tox runs a bare flake8, which would lint thousands of generated files.
exclude = .tox,env*,build,help,qt/resources_data.py,pkg,mutants
max-line-length = 120
select = C,E,F,W,B,B950
extend-ignore = E203,W503
