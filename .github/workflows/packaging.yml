# Builds a frozen executable and smoke-tests it. Manual only.
#
# Packaging is not part of normal CI, because freezing is slow. It is dispatched by hand at
# release time, against the tag rather than a branch -- an artifact labelled 4.9.0 that does not
# contain the code tagged 4.9.0 is a mislabelled release, and that happened once.
#
# Every release from 4.9.0 onward attaches what this builds, so a packaging bug is live rather
# than latent. Issues #10 and #27 also concern behaviour that *only* exists in a frozen build,
# which nothing else can check.
#
# What this can and cannot prove:
#   - It CAN build the app frozen, and run a real content scan through the frozen CLI. That
#     scan uses the ProcessPoolExecutor in core/scanner.py::_hash_files_parallel, which is
#     the code path issue #10 is about, so a re-execution bug there shows up here.
#   - It CANNOT check the GUI. The symptom described in #10 -- extra windows -- needs a
#     desktop session and a person. Nor does it run the NSIS installer/uninstaller, which is
#     what #27's setup.nsi item concerns. Those remain manual.
#   - It CANNOT say anything about a *downloaded* copy of what it builds. A GitHub artifact is
#     zipped, which drops symlinks and executable bits, so a binary that runs here can be
#     unrunnable once fetched. See the note on the freeze job below.

name: Packaging

on:
  workflow_dispatch:
    inputs:
      attach:
        description: "Attach the built installer and disk image to the release for this tag"
        type: boolean
        default: true

# Least privilege: these jobs only check out code and upload artifacts. Without this they
# inherit the repository default, which is `write` -- a token that can push to master and
# edit releases, handed to jobs that pip install a large third-party dependency tree.
#
# The `attach` job below raises this to `contents: write` for itself alone. It has to, to touch
# a release -- but it installs nothing and checks out nothing, so the token is never in the same
# job as the dependency tree. That separation is the whole point: it is why attaching is a
# distinct job rather than two more lines at the end of `applications`.
permissions:
  contents: read

jobs:
  freeze:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt -r requirements-extra.txt
      - name: Build python modules
        run: python build.py --modules
      - name: Freeze the CLI
        # Through package.py's build_cli rather than a pyinstaller line of its own, so this
        # tests the configuration that actually ships -- Qt excluded and all. Two invocations
        # would drift, and the drift would be silent: this job would keep passing while
        # exercising a build nobody installs.
        run: python -c "import sys; from package import build_cli; sys.exit(0 if build_cli('dist-freeze', 'build-freeze') else 1)"
      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          set -euo pipefail
          # Random payloads so nothing can be served from the hash cache: every file must be
          # hashed, which is what puts work through the process pool.
          python - <<'PY'
          import pathlib, uuid
          d = pathlib.Path("scan-fixture"); d.mkdir(exist_ok=True)
          tag = uuid.uuid4().hex
          # >500 pairs on purpose. _hash_files_parallel only emits its "Hashing files N/M"
          # progress every _BATCH_SIZE (500) files, and that message is the only externally
          # visible proof the hashing loop ran at all. Small payloads keep this quick.
          for i in range(700):
              payload = (f"{tag}-{i}-".encode() * 700)     # ~5 KB
              (d / f"a{i}.bin").write_bytes(payload)
              (d / f"b{i}.bin").write_bytes(payload)
          PY
          BIN=dist-freeze/dupeguru-scan/dupeguru-scan
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # Exit code 1 is EXIT_DUPES_FOUND, which is the expected success here.
          set +e
          "$BIN" scan-fixture --verbose > scan-out.json 2> scan-err.txt
          rc=$?
          set -e
          echo "exit code: $rc"
          tail -5 scan-err.txt || true
          if [ "$rc" -ne 1 ]; then echo "::error::expected exit 1 (duplicates found), got $rc"; exit 1; fi
          python - <<'PY'
          import json, sys, pathlib
          stats = json.load(open("scan-out.json"))["stats"]
          print("stats:", stats)
          if stats["groups"] != 700:
              sys.exit(f"::error::expected 700 groups, got {stats['groups']}")
          err = pathlib.Path("scan-err.txt").read_text(errors="replace")
          # Fingerprints of the issue #10 failure mode: a spawn child re-executing the
          # program instead of running the worker.
          for marker in ("bootstrapping phase", "falling back to sequential"):
              if marker in err:
                  sys.exit(f"::error::frozen build shows parallel-hashing trouble: {marker!r}")
          # Correct results alone do not show the process pool was used -- a scan that
          # silently fell back, or never reached the hashing loop, also produces them. This
          # message comes from the hashing loop itself, and the fallback path is excluded by
          # the check above, so together they establish that the pool did the work.
          if "Hashing files" not in err:
              sys.exit("::error::no sign the parallel hashing loop ran; this test would not "
                       "have detected a broken process pool")
          print("frozen content scan OK: parallel hashing ran, no re-execution markers")
          PY
      # Deliberately not uploaded. This build was published as a `frozen-cli-*` artifact until
      # 4.14.0, and every download of it was broken: GitHub artifacts are zipped, zip does not
      # carry symlinks, and the bundle contains a Python.framework, which cannot resolve without
      # them. A downloaded copy segfaulted during dyld's initializer pass, before any dupeGuru
      # code ran -- while this smoke test passed, because it runs the binary in place. Both were
      # true at once, which made the artifact look verified when it had never been runnable.
      #
      # The `applications` job below hits the same hazard and solves it by wrapping the .app in
      # a .dmg; the same treatment was never applied here.
      #
      # Nothing consumed this artifact, so it is simply not produced. The value of this job is
      # the smoke test above, which needs no upload to do its work. If a downloadable frozen CLI
      # is ever wanted, tar the directory first -- do not add a plain upload back.

  applications:
    # The real deliverables, and what every release from 4.9.0 onward attaches: an NSIS
    # installer on Windows, a disk image on macOS. Since 4.15.0 both also carry the
    # command-line scanner -- see the note on the freeze job about why that is built
    # separately and without Qt.
    #
    # Separate from the freeze job above, which smoke-tests the CLI against issue #10.
    # This job only builds and uploads artifacts; the `attach` job below puts them on the
    # release. It used to be a human who did that, and twice nobody did (#216).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt -r requirements-extra.txt
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Build modules, localisations and help
        # package.py refuses to run without build/locale and build/help, and would otherwise
        # ship an application with no translations and no help.
        run: |
          python build.py --modules
          python build.py --loc
          python build.py --doc
      - name: Package
        run: python package.py
      - name: Build disk image (macOS)
        # package.py leaves a .app. Uploading that directly loses the executable bit, because
        # GitHub artifacts are zipped and zip does not carry it -- the download would not run.
        # A .dmg preserves permissions and is what a macOS user expects anyway.
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-dmg
          python -c "from hscommon.build import build_dmg; build_dmg('dist/dupeguru.app', 'dist-dmg')"
      - name: Verify an artifact was produced
        # package.py returns non-zero on failure now, but a tool can exit 0 and write nothing,
        # which is how a missing pyrcc5 once produced a successful build with no icons.
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            artifact=$(ls dist/dupeGuru_win*_*.exe 2>/dev/null | head -1)
          else
            artifact=$(ls dist-dmg/*.dmg 2>/dev/null | head -1)
          fi
          if [ -z "${artifact:-}" ]; then echo "::error::no installer or disk image was produced"; exit 1; fi
          size=$(wc -c < "$artifact")
          echo "built $artifact ($size bytes)"
          # A few hundred bytes would mean a stub, not an application.
          if [ "$size" -lt 5000000 ]; then echo "::error::$artifact is implausibly small"; exit 1; fi
      - name: Verify the shipped command line runs
        # Not "is the file there" -- that is the check that let a frozen CLI ship broken for two
        # releases (#159). This runs the binary from where a user will actually find it, after
        # package.py has put it there, and makes it do a real scan.
        #
        # macOS runs it from inside the built bundle. Windows runs it from the dist tree NSIS
        # copies; unpacking the installer to check would need a silent install, which is its own
        # untested thing, so this stops one step short and is honest about that.
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cli="dist/dupeguru-win64/cli/dupeguru-scan/dupeguru-scan.exe"
          else
            cli="dist/dupeguru.app/Contents/Resources/cli/dupeguru-scan/dupeguru-scan"
          fi
          if [ ! -f "$cli" ]; then echo "::error::the command line was not packaged at $cli"; exit 1; fi
          "$cli" --help > /dev/null
          mkdir -p cli-fixture
          printf 'duplicate' > cli-fixture/one.txt
          printf 'duplicate' > cli-fixture/two.txt
          # Exit 1 is EXIT_DUPES_FOUND, the expected success here.
          set +e
          "$cli" cli-fixture --plan > cli-plan.json 2> cli-plan.err
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then echo "::error::expected exit 1 (duplicates found), got $rc"; cat cli-plan.err; exit 1; fi
          python - <<'PY'
          import json, sys
          stats = json.load(open("cli-plan.json"))["stats"]
          print("shipped CLI plan stats:", stats)
          if stats["would_delete"] != 1:
              sys.exit(f"::error::expected 1 planned deletion, got {stats['would_delete']}")
          # Present only when the build carries this release's core, so it also catches a CLI
          # frozen against a stale checkout.
          if "confidence" not in stats:
              sys.exit("::error::the shipped CLI predates confidence reporting")
          print("shipped command line OK")
          PY
      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupeguru-windows-installer
          path: dist/dupeGuru_win*_*.exe
      - name: Upload disk image (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupeguru-macos-dmg
          path: dist-dmg/*.dmg

  attach:
    # Puts what `applications` built onto the release, which used to be a manual step and was
    # therefore forgotten: 4.19.0 and 4.20.0 were both published with no downloads at all, so
    # for a while the newest build anyone could install was two versions old. Nothing failed
    # and nothing warned -- a green packaging run simply was not the end of a release (#216).
    #
    # Deliberately a separate job. It needs `contents: write` to touch a release, and the
    # reason the build jobs must not have that is they pip install a large third-party
    # dependency tree. This one installs nothing, checks out nothing, and uses no third-party
    # action -- `gh` is preinstalled on the runner -- so a compromised package never sits in
    # the same job as a token that can rewrite a download.
    needs: applications
    if: ${{ inputs.attach && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload release assets
      actions: read # to download this run's own artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download what this run built
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --dir assets
      - name: Attach them to the release
        run: |
          set -euo pipefail
          # A release has to exist already; this attaches to one rather than publishing it, so
          # that what the notes say and what the binaries are stay a human decision.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::no release exists for $TAG. Create it, then re-run this workflow." >&2
            exit 1
          fi
          dmg=$(find assets -name 'dupeguru_osx_*.dmg' | head -1)
          exe=$(find assets -name 'dupeGuru_win64_*.exe' | head -1)
          if [ -z "$dmg" ] || [ -z "$exe" ]; then
            echo "::error::expected a .dmg and a .exe among the artifacts, found: $(find assets -type f | tr '\n' ' ')" >&2
            exit 1
          fi
          # --clobber so a re-run replaces rather than failing half way.
          gh release upload "$TAG" "$dmg" "$exe" --repo "${{ github.repository }}" --clobber
      - name: Verify the release actually offers them
        run: |
          set -euo pipefail
          # The check that was missing. An upload can report success and leave a release with
          # nothing on it, and that is invisible until somebody tries to download.
          names=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '[.assets[].name] | join(" ")')
          echo "release $TAG now offers: $names"
          case "$names" in
            *.dmg*) ;;
            *) echo "::error::$TAG has no disk image after upload" >&2; exit 1 ;;
          esac
          case "$names" in
            *.exe*) ;;
            *) echo "::error::$TAG has no installer after upload" >&2; exit 1 ;;
          esac
