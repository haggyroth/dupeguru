[metadata]
name = dupeGuru
version = attr: core.__version__
url = https://github.com/haggyroth/dupeguru
project_urls =
    Bug Reports = https://github.com/haggyroth/dupeguru/issues
    Upstream = https://github.com/arsenetar/dupeguru
author = Andrew Senetar
author_email = arsenetar@voltaicideas.net
license = GPLv3
license_files = license
description = dupeGuru is a tool to find duplicate files on your computer.
long_description = file:README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3 :: Only
    Topic :: Desktop Environment :: File Managers

[options]
packages = find:
# 3.10 is the floor: core/hash_cache.py annotates with PEP 604 unions (X | None) in
# function signatures, which are evaluated at import time on Python <= 3.13 and have no
# `from __future__ import annotations` to defer them. 3.8 fails on the builtin generic,
# 3.9 on the union operator.
python_requires = >=3.10
install_requires =
    Send2Trash>=1.8.2,<2.0.0
    mutagen>=1.46.0,<2.0.0
    distro>=1.8.0,<2.0.0
    PyQt5 >=5.15.0,<6.0; sys_platform != 'linux'
    pywin32>=228; sys_platform == 'win32'
    semantic-version>=2.0.0,<3.0.0
    xxhash>=3.0.0,<4.0.0
setup_requires =
    sphinx>=3.0.0
    polib>=1.1.0
tests_require =
    pytest >=7,<8
    pytest-cov >=4.0.0
include_package_data = true

[options.entry_points]
console_scripts =
    dupeguru = run.py
    dupeguru-scan = cli:main

[coverage:run]
branch = false
omit =
    # Test code is ~100% covered by definition and inflates the headline number.
    */tests/*
    */testutil.py
    # Build and localisation tooling: run at package time, not by the application.
    hscommon/build.py
    hscommon/pygettext.py
    hscommon/sphinxgen.py
    hscommon/loc.py
    build.py
    package.py
    run.py

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
